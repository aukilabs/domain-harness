[package]
name = "spatial-home"
version = "0.1.0"
edition = "2024"
default-run = "spatial-home"

[workspace]
members = ["ios/PortalBridge"]
default-members = ["."]
resolver = "3"
exclude = ["vendor/auki-p2p", "vendor/auki-component-protocol"]

[patch."https://github.com/aukilabs/auki-sdk.git"]
auki-p2p = { path = "vendor/auki-p2p" }
auki-component-protocol = { path = "vendor/auki-component-protocol" }

[dependencies]
auki-protocols = { git = "https://github.com/aukilabs/auki-sdk.git", rev = "3342d589605846f5f45c1de5430dd22923555de2", features = ["registry-endpoint"] }
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
image = { version = "0.25", default-features = false, features = ["jpeg"] }
anyhow = "1"
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "process", "io-util"] }
tokio-util = { version = "0.7", features = ["rt"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
auki-components = { git = "https://github.com/aukilabs/auki-sdk.git", rev = "3342d589605846f5f45c1de5430dd22923555de2" }
auki-scenegraph = { git = "https://github.com/aukilabs/auki-sdk.git", rev = "3342d589605846f5f45c1de5430dd22923555de2" }
auki-voxel-map = { path = "vendor/auki-voxel-map" }
auki-registry = { git = "https://github.com/aukilabs/auki-sdk.git", rev = "3342d589605846f5f45c1de5430dd22923555de2" }
auki-geometry = { git = "https://github.com/aukilabs/auki-sdk.git", rev = "3342d589605846f5f45c1de5430dd22923555de2" }
auki-datatypes = { git = "https://github.com/aukilabs/auki-sdk.git", rev = "3342d589605846f5f45c1de5430dd22923555de2" }
auki-sdk = { git = "https://github.com/aukilabs/auki-sdk.git", rev = "3342d589605846f5f45c1de5430dd22923555de2" }
auki-component-protocol = { git = "https://github.com/aukilabs/auki-sdk.git", rev = "3342d589605846f5f45c1de5430dd22923555de2" }

auki-odometry = { git = "https://github.com/aukilabs/auki-sdk.git", rev = "3342d589605846f5f45c1de5430dd22923555de2" }

base64 = "0.22"
prost = "0.13"
calib-targets-aruco = "0.15.4"

auki-mappers = { git = "https://github.com/aukilabs/auki-sdk.git", rev = "3342d589605846f5f45c1de5430dd22923555de2", default-features = false }

auki-qr-detector = { git = "https://github.com/aukilabs/auki-sdk.git", rev = "3342d589605846f5f45c1de5430dd22923555de2" }
auki-qr-localizer = { git = "https://github.com/aukilabs/auki-sdk.git", rev = "3342d589605846f5f45c1de5430dd22923555de2" }

# The explicitly enabled robot simulator uses an isolated loopback authority.
chrono = "0.4"
jsonwebtoken = "9"
p256 = { version = "0.13", features = ["pem"] }
rand = "0.8"
auki-p2p = { git = "https://github.com/aukilabs/auki-sdk.git", rev = "3342d589605846f5f45c1de5430dd22923555de2" }

[dev-dependencies]
qrcode = { version = "0.14", default-features = false }
tempfile = "3"

# Live multi-sensor mapping runs on the robot too. Optimize the CPU-heavy map
# and serialization paths while retaining debug symbols and fast dependency builds.
[profile.dev.package.spatial-home]
opt-level = 2
[profile.dev.package.auki-voxel-map]
opt-level = 2
[profile.dev.package.auki-maps]
opt-level = 2
[profile.dev.package.auki-mappers]
opt-level = 2

[profile.dev.package.auki-qr-detector]
opt-level = 2
[profile.dev.package.auki-qr-localizer]
opt-level = 2
[profile.dev.package.qr-lab]
opt-level = 2
# qr-lab is a re-export facade: optimize the crates that actually scan pixels.
# Per-package profile overrides do not propagate to dependencies.
[profile.dev.package.qr-lab-qr]
opt-level = 2
[profile.dev.package.qr-lab-imgproc]
opt-level = 2
[profile.dev.package.qr-lab-image]
opt-level = 2
[profile.dev.package.qr-lab-geometry]
opt-level = 2
[profile.dev.package.auki-geometry]
opt-level = 2
# Portal detectors decode every camera JPEG and resize frames for the
# small-code retry; unoptimized, these dominate the robot's detector time.
[profile.dev.package.image]
opt-level = 2
[profile.dev.package.zune-jpeg]
opt-level = 2
[profile.dev.package.pnp-core]
opt-level = 2
