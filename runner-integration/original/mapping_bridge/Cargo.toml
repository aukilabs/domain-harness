[package]
name = "galbot-component-python"
version = "0.1.0"
edition = "2024"

[lib]
name = "auki_sdk"
crate-type = ["cdylib", "rlib"]

[features]
extension-module = ["pyo3/extension-module"]

[dependencies]
image = { version = "0.25", default-features = false, features = ["jpeg"] }
auki-qr-localizer = { features = ["qr-detector"], git = "https://github.com/aukilabs/auki-sdk", rev = "3342d589605846f5f45c1de5430dd22923555de2" }
auki-odometry = { git = "https://github.com/aukilabs/auki-sdk", rev = "3342d589605846f5f45c1de5430dd22923555de2" }
sdk_python = { package = "auki-sdk-py", features = ["embedded"], git = "https://github.com/aukilabs/auki-sdk", rev = "3342d589605846f5f45c1de5430dd22923555de2" }
auki-sdk = { git = "https://github.com/aukilabs/auki-sdk", rev = "3342d589605846f5f45c1de5430dd22923555de2" }
auki-components = { git = "https://github.com/aukilabs/auki-sdk", rev = "3342d589605846f5f45c1de5430dd22923555de2" }
auki-component-protocol = { git = "https://github.com/aukilabs/auki-sdk", rev = "3342d589605846f5f45c1de5430dd22923555de2" }
auki-portal-detector = { git = "https://github.com/aukilabs/auki-sdk", rev = "3342d589605846f5f45c1de5430dd22923555de2" }
auki-qr-mapper = { git = "https://github.com/aukilabs/auki-sdk", rev = "3342d589605846f5f45c1de5430dd22923555de2" }
auki-domain-client = { git = "https://github.com/aukilabs/auki-sdk", rev = "3342d589605846f5f45c1de5430dd22923555de2" }
auki-scenegraph = { git = "https://github.com/aukilabs/auki-sdk", rev = "3342d589605846f5f45c1de5430dd22923555de2" }
auki-geometry = { git = "https://github.com/aukilabs/auki-sdk", rev = "3342d589605846f5f45c1de5430dd22923555de2", features = ["pnp"] }
auki-datatypes = { git = "https://github.com/aukilabs/auki-sdk", rev = "3342d589605846f5f45c1de5430dd22923555de2" }
pyo3 = { version = "0.22", features = ["abi3-py38"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
tokio-util = "0.7"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
qrcode = "0.14"
jsonwebtoken = "10.4"
chrono = "0.4"

auki-p2p = { git = "https://github.com/aukilabs/auki-sdk", rev = "3342d589605846f5f45c1de5430dd22923555de2" }
pyo3 = { version = "0.22", features = ["abi3-py38", "auto-initialize"] }
